<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2D35" />
      <stop offset="100%" stop-color="#0F0F13" />
    </linearGradient>

    <filter id="led-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#obsidian-bg)" />

  <g transform="rotate(-45 256 256)">
    
    <path d="M 360 196 A 120 120 0 1 0 360 316" 
          fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />

    <circle cx="376" cy="256" r="24" fill="#FF8C00" filter="url(#led-glow)" />
    
  </g>
</svg>
