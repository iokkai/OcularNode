name: OcularNode Release CI/CD

# 觸發條件：當推送到 main 分支的標籤 (Tag) 為 v 開頭時 (例如 v1.0)，或手動觸發
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

jobs:
  build-and-release:
    name: Build and Publish Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 GitHub Actions 建立 Release 並上傳檔案

    steps:
      - name: 📥 取得程式碼 (完整歷史與 Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 設定 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ⚙️ 賦予 Gradle 執行權限
        run: chmod +x gradlew

      - name: 🔢 計算語意版本號 (SemVer to versionCode)
        id: parse_version
        run: |
          # 取得觸發這次 Action 的 Tag 名稱 (例如 v0.2.1)
          TAG_NAME="${{ github.ref_name }}"
          
          # 移除開頭的 'v' (變成 0.2.1)
          CLEAN_VERSION="${TAG_NAME#v}"
          
          # 決定 Release 的 Tag 名稱：如果是手動觸發 (沒有 v 開頭)，則使用 run_number
          if [[ "$TAG_NAME" != v* ]]; then
            RELEASE_TAG="build-${{ github.run_number }}"
            VERSION_CODE=${{ github.run_number }}
          else
            RELEASE_TAG="$TAG_NAME"
            # 假設版號格式為 主版.次版.修訂版 (例如 0.2.1)
            MAJOR=$(echo "$CLEAN_VERSION" | awk -F. '{print $1}')
            MINOR=$(echo "$CLEAN_VERSION" | awk -F. '{print $2}')
            PATCH=$(echo "$CLEAN_VERSION" | awk -F. '{print $3}')
            
            # 防呆：如果沒有 patch 或 minor 預設為 0
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          fi
          
          echo "當前 Tag: $TAG_NAME"
          echo "目標 Release Tag: $RELEASE_TAG"
          echo "計算出的 versionCode = $VERSION_CODE"
          
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: 🔑 準備 Keystore 檔案
        run: |
          # 將 GitHub Secrets 中的 BASE64 Keystore 解碼並存入檔案
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/keystore.jks


      - name: 🔨 編譯與簽名 Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleArmRelease -PversionCode=${{ steps.parse_version.outputs.version_code }} -PversionName=${{ steps.parse_version.outputs.version_name }}

      - name: 📝 自動產生 Release 變更說明與校驗碼 (Changelog & Checksums)
        id: generate_release_notes
        run: |
          TAG_NAME="${{ steps.parse_version.outputs.release_tag }}"
          
          # 尋找前一個 Tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          echo "前一個 Tag: $PREV_TAG"
          
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$TAG_NAME"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}"
          else
            RANGE="$TAG_NAME"
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${TAG_NAME}"
          fi
          
          echo "## 🚀 OcularNode $TAG_NAME" > release_notes.md
          echo "" >> release_notes.md
          
          # 提取分類 Commit 紀錄 (嚴格依照 Conventional Commits 規範)
          FEAT=$(git log $RANGE --no-merges -i --grep="^feat" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          FIX=$(git log $RANGE --no-merges -i --grep="^fix" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          PERF=$(git log $RANGE --no-merges -i --grep="^perf" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          REFACTOR=$(git log $RANGE --no-merges -i --grep="^refactor" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          DOCS=$(git log $RANGE --no-merges -i --grep="^docs" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          STYLE=$(git log $RANGE --no-merges -i --grep="^style" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          TEST=$(git log $RANGE --no-merges -i --grep="^test" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          CHORE=$(git log $RANGE --no-merges -i --grep="^chore" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          REVERT=$(git log $RANGE --no-merges -i --grep="^revert" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          OTHER=$(git log $RANGE --no-merges -i --grep="^feat" --grep="^fix" --grep="^perf" --grep="^refactor" --grep="^docs" --grep="^style" --grep="^test" --grep="^chore" --grep="^revert" --invert-grep --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          
          if [ -n "$FEAT" ]; then
            echo "### ✨ 新增功能 (Features)" >> release_notes.md
            echo "$FEAT" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$FIX" ]; then
            echo "### 🐛 問題修復 (Bug Fixes)" >> release_notes.md
            echo "$FIX" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$PERF" ]; then
            echo "### ⚡ 效能優化 (Performance)" >> release_notes.md
            echo "$PERF" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$REFACTOR" ]; then
            echo "### 🔨 程式碼重構 (Refactoring)" >> release_notes.md
            echo "$REFACTOR" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$DOCS" ]; then
            echo "### 📚 文件變更 (Documentation)" >> release_notes.md
            echo "$DOCS" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$STYLE" ]; then
            echo "### 🎨 格式修正 (Style)" >> release_notes.md
            echo "$STYLE" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$TEST" ]; then
            echo "### 🧪 測試變更 (Testing)" >> release_notes.md
            echo "$TEST" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$CHORE" ]; then
            echo "### 🔧 雜項與建置 (Chore)" >> release_notes.md
            echo "$CHORE" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$REVERT" ]; then
            echo "### ⏪ 還原變更 (Reverts)" >> release_notes.md
            echo "$REVERT" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$OTHER" ]; then
            echo "### 📝 其他變更 (Other Changes)" >> release_notes.md
            echo "$OTHER" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          echo "---" >> release_notes.md
          echo "🔗 **完整變更比對 (Full Changelog)**: [$RANGE]($COMPARE_URL)" >> release_notes.md
          echo "" >> release_notes.md
          
          # 加入 APK SHA-256 Checksums
          echo "### 🔐 APK SHA-256 Checksums" >> release_notes.md
          echo '```' >> release_notes.md
          cd app/build/outputs/apk
          sha256sum **/*.apk 2>/dev/null | awk '{print $1 "  " $2}' >> ../../../release_notes.md || true
          cd ../../..
          echo '```' >> release_notes.md
          
          cat release_notes.md

      - name: 📦 上傳 APK 到 Action Artifacts (備份)
        uses: actions/upload-artifact@v4
        with:
          name: ocularnode-release-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 7

      - name: 🚀 發布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_version.outputs.release_tag }}
          name: OcularNode Release ${{ steps.parse_version.outputs.release_tag }}
          body_path: release_notes.md
          files: app/build/outputs/apk/**/release/*.apk
